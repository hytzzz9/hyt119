<!DOCTYPE html>

  功能名称：科技新闻列表页，展示后端接口地址与数据库中的新闻数据

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技新闻 · 侯雨彤</title>
    <link rel="stylesheet" href="css/hyt_news.css">
</head>
<body>
    <div class="hyt_glow hyt_glow--a"></div>
    <div class="hyt_glow hyt_glow--b"></div>

    <header class="hyt_head">
        <span class="hyt_badge">数据来自 MySQL</span>
        <h1>科技新闻</h1>
        <p class="hyt_sub">列表数据由后端从数据库表 <code>hyt_news</code> 读取后返回</p>
        <div class="hyt_meta">
            <span>姓名<b>侯雨彤</b></span>
            <span>学号<b>24002120119</b></span>
            <span>数据表<b>hyt_news</b></span>
        </div>
    </header>

    <main class="hyt_main">
        <section class="hyt_apiBar">
            <div class="hyt_apiInfo">
                <span class="hyt_apiMethod">GET</span>
                <a class="hyt_apiLink" id="hyt_apiLink" href="/api/news" target="_blank" rel="noopener">/api/news</a>
            </div>
            <div class="hyt_apiSide">
                <span class="hyt_apiCount" id="hyt_apiCount">共 -- 条</span>
                <button class="hyt_btn" type="button" id="hyt_refreshBtn">刷新</button>
            </div>
        </section>

        <p class="hyt_tip" id="hyt_tip">正在加载新闻…</p>

        <ul class="hyt_list" id="hyt_list"></ul>
    </main>

    <footer class="hyt_footer">
        <a href="index.html">← 返回项目首页</a>
    </footer>

    <script src="js/hyt_news.js"></script>
</body>
</html>
